name: Test and package the addon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Test the bundled data and interface
        run: lua5.1 dev/test.lua
      - name: Package the addon
        run: python3 dev/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: BiSFit-install
          path: dist/BiSFit-*.zip
          if-no-files-found: error
